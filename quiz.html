<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSLA - Practice Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">RSLA</div>
    <div class="welcome">Practice Quiz</div>
</header>

<main class="dashboard">

    <h1>Choose a Subject</h1>

    <p class="intro">
        Select a subject to start your practice quiz.
    </p>

    <section class="cards">

        <div class="card">
            <div class="icon">🔢</div>
            <h2>Mathematics</h2>
            <p>Practice Mathematics topics.</p>
            <button onclick="startQuiz('Mathematics')">
                Start Quiz
            </button>
        </div>

        <div class="card">
            <div class="icon">🔬</div>
            <h2>Science</h2>
            <p>Practice Science topics.</p>
            <button onclick="startQuiz('Science')">
                Start Quiz
            </button>
        </div>

        <div class="card">
            <div class="icon">📖</div>
            <h2>English</h2>
            <p>Practice English topics.</p>
            <button onclick="startQuiz('English')">
                Start Quiz
            </button>
        </div>

    </section>

</main>

<script>
function startQuiz(subject) {

    window.location.href =
        "quiz-question.html?subject=" +
        encodeURIComponent(subject);

}
</script>

</body>
</html>
